version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint declares peerDependencies.typescript ">=4.8.4 <6.1.0",
      # so anything at or above 6.1.0 fails `npm ci` with ERESOLVE and, if forced
      # past that, trips an explicit "does not support TS 7.0" guard in eslint.
      # The bound mirrors that ceiling exactly: 6.0.x is still offered because
      # typescript-eslint supports it. Drop this entry once typescript-eslint
      # admits 7.x -- see rubicon/career-ops-capture#44.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
