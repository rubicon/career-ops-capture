name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Propose release
    runs-on: ubuntu-latest
    steps:
      # App credentials come from 1Password at runtime (single source of truth in
      # the Automation vault). OP_SERVICE_ACCOUNT_TOKEN is the only repository
      # secret; the app id and private key are not stored as repository secrets.
      # They are fetched into this step's outputs so the next step can mint a
      # token, and are masked in the log, but they do reach the runner. Saying
      # they "never leave 1Password" would overstate it.
      #
      # The item is addressed by its UUID, not its title. Titles are mutable: a
      # rename of this item once broke every release run in these repos. A UUID
      # cannot drift that way. It identifies the rubicon-release-please GitHub App
      # key and is an address, not a secret.
      - name: Load app credentials from 1Password
        id: op
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: false
          version: 2.35.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          RELEASE_PLEASE_APP_ID: "op://Automation/lnacky4l2tmlihrockbutkub7y/app id"
          RELEASE_PLEASE_APP_KEY: "op://Automation/lnacky4l2tmlihrockbutkub7y/private key"

      # A GitHub App token gives release-please a signing identity, so the
      # commits it creates are verified.
      - name: Mint app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ steps.op.outputs.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ steps.op.outputs.RELEASE_PLEASE_APP_KEY }}
          # Without these, the token carries every permission the App
          # installation holds, which is far more than release-please uses. Scope
          # it to what the action actually does: commit and tag (contents), and
          # open and update the release PR (pull-requests).
          #
          # Deliberately NOT permission-issues. The autorelease labels are an
          # issues permission even on a PR, so requesting it looked right — but
          # the rubicon-release-please App grants only metadata plus code and
          # pull requests, and create-github-app-token fails the whole request
          # when any requested scope exceeds the grant. That took releases here
          # down from 2026-07-30 until #48. The sibling repos (plugin-markdown,
          # plugin-docx, plugin-big-boards) run this same workflow against the
          # same App with no scoping at all and still get "autorelease: pending"
          # on their release PRs, so the label does not in fact need the issues
          # scope. Granting it on the App would widen permissions across every
          # repository the installation covers to satisfy a request that three
          # working repos show is unnecessary.
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
