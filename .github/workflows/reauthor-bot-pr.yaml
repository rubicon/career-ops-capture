name: Reauthor bot PR

# Manually reauthors a Dependabot or release-please PR as the maintainer before
# merge, so main's contributor graph reflects a human, not the bot that wrote
# the diff. main's existing history was fixed once via a git-filter-repo
# rewrite; this workflow is the forward-looking fix so it doesn't recur.
#
# Deliberately workflow_dispatch, not an automatic pull_request trigger: a
# pull_request-triggered workflow on a Dependabot PR gets a read-only
# GITHUB_TOKEN and no secrets access by default, and this workflow needs write
# access plus a signing key. A human already decides when to merge these PRs
# (see the repository process policy); this adds a reauthoring step before
# that decision, not a replacement for it.
#
# What it does NOT do: touch the original bot PR's own branch or commits. It
# reads the PR's diff and title, then builds an entirely new, signed commit on
# a new branch and opens a fresh PR. The original PR is left open and gets a
# comment pointing at the replacement.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Number of the Dependabot/release-please PR to reauthor"
        required: true
        type: string

# The job authenticates as the release-please GitHub App for every write. The
# default GITHUB_TOKEN is deliberately left read-only: a pull request opened
# with it does not trigger workflows, so the replacement PR would sit with no
# CI and could never satisfy the required "Lint, validate, build, test" check.
permissions:
  contents: read

jobs:
  reauthor:
    name: Reauthor and open replacement PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # The signing-key item is addressed by UUID, for the same reason the
      # release-please credentials are: titles are mutable, and a rename of one
      # of these items once broke every release run in these repos. The UUID
      # lives in a repository variable rather than inline only because the item
      # is provisioned after this workflow lands. It is an address, not a secret.
      - name: Check the inputs
        env:
          ITEM: ${{ vars.REAUTHOR_SIGNING_KEY_ITEM }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -z "$ITEM" ]; then
            echo "::error::Repository variable REAUTHOR_SIGNING_KEY_ITEM is unset. Set it to the UUID of the Automation-vault item holding the CI signing key, then re-run."
            exit 1
          fi
          # pr_number is a free-text dispatch input that ends up in a git refspec
          # and a branch name. Pin it to digits before it reaches either.
          case "$PR_NUMBER" in
            "" | *[!0-9]*)
              echo "::error::pr_number must be digits only, got '$PR_NUMBER'."
              exit 1
              ;;
          esac

      # Same 1Password service-account pattern release-please.yaml already uses:
      # OP_SERVICE_ACCOUNT_TOKEN is the only repository secret, scoped read-only
      # to the Automation vault. The signing key is dedicated to CI commit
      # signing -- it is not the maintainer's personal daily-use key -- so a
      # leak here is revocable from GitHub's signing-keys list without touching
      # the maintainer's actual identity or access.
      #
      # The App credentials are loaded alongside it because every write below
      # goes through an App token rather than GITHUB_TOKEN. The two are separate
      # on purpose: the App identity must not be able to sign as a person.
      - name: Load credentials from 1Password
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
          version: 2.35.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          RELEASE_PLEASE_CLIENT_ID: "op://Automation/lnacky4l2tmlihrockbutkub7y/client id"
          RELEASE_PLEASE_APP_KEY: "op://Automation/lnacky4l2tmlihrockbutkub7y/private key"
          CI_SIGNING_KEY: "op://Automation/${{ vars.REAUTHOR_SIGNING_KEY_ITEM }}/private key"

      - name: Mint app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ steps.op.outputs.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.RELEASE_PLEASE_APP_KEY }}
          # Scoped to what this workflow does: push a branch (contents), open
          # and comment on pull requests (pull-requests). See the note in
          # release-please.yaml about why issues scope is not requested.
          permission-contents: write
          permission-pull-requests: write

      - name: Look up and vet the source PR
        id: source-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json title,headRefName,author,state,isCrossRepository \
            > "$RUNNER_TEMP/source-pr.json"

          state=$(jq -r '.state' "$RUNNER_TEMP/source-pr.json")
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is not open (state: $state); nothing to reauthor." >&2
            exit 1
          fi

          # This workflow signs as a person and pushes with a write token, so
          # the diff it squashes has to come from a trusted first-party author.
          # A human PR does not need reauthoring in the first place.
          author=$(jq -r '.author.login' "$RUNNER_TEMP/source-pr.json")
          case "$author" in
            dependabot* | rubicon-release-please*) ;;
            *)
              echo "PR #$PR_NUMBER's author ($author) is not a recognized automation bot. Refusing to reauthor a human-authored PR." >&2
              exit 1
              ;;
          esac

          # Neither bot opens from a fork, and a fork PR's diff is not trusted
          # input for a signing workflow.
          if [ "$(jq -r '.isCrossRepository' "$RUNNER_TEMP/source-pr.json")" != "false" ]; then
            echo "PR #$PR_NUMBER comes from a fork; refusing." >&2
            exit 1
          fi

          {
            echo "title=$(jq -r '.title' "$RUNNER_TEMP/source-pr.json")"
            echo "branch=chore/reauthor-pr-$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Squash the PR's diff onto a new branch
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ steps.source-pr.outputs.branch }}
        run: |
          set -euo pipefail
          # pull/N/head resolves whatever the PR actually points at, without
          # depending on a remote-tracking ref for the bot's branch existing.
          git fetch origin "pull/$PR_NUMBER/head:pr-head"
          git switch -c "$BRANCH"
          # --squash stages the combined diff without recording the bot as a
          # parent or an author, which is the whole point of this workflow.
          git merge --squash pr-head
          if git diff --cached --quiet; then
            echo "PR #$PR_NUMBER has no changes against main; nothing to reauthor." >&2
            exit 1
          fi

      # The signature has to verify against the maintainer's account, so the
      # committer identity must be his as well as the author: GitHub matches the
      # signing key to a user, then checks the committer address against it.
      - name: Commit as the maintainer, signed
        env:
          SSH_PRIVATE_KEY: ${{ steps.op.outputs.CI_SIGNING_KEY }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TITLE: ${{ steps.source-pr.outputs.title }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/ci-signing-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"

          git config user.name "Dax Davis"
          git config user.email "98216+rubicon@users.noreply.github.com"
          git config gpg.format ssh
          git config user.signingkey "$key"

          git commit -S -m "$TITLE" \
            -m "Reauthors #$PR_NUMBER, carrying its diff onto a commit authored and signed by the maintainer. The content is unchanged."

          rm -f "$key"
          # Fails the job if the commit came out unsigned, rather than letting
          # branch protection reject it later with no explanation.
          test "$(git log -1 --format='%G?')" = "G"

      - name: Push and open the replacement PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ steps.source-pr.outputs.branch }}
          TITLE: ${{ steps.source-pr.outputs.title }}
        run: |
          set -euo pipefail
          git push origin "$BRANCH"
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --head "$BRANCH" \
            --base main \
            --body "Reauthored copy of #$PR_NUMBER's diff, authored and signed as the maintainer instead of the bot. The content is unchanged, and this goes through the same required checks and the same human merge as the original.

          #$PR_NUMBER is left open on purpose. Closing it is a merge-time judgment call, and closing it early tells Dependabot the advisory was declined, so it will not raise a fresh PR for the same one.")

          # Closing keywords only close issues, never pull requests, so the
          # original is linked by comment rather than by a keyword that would
          # silently do nothing.
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Superseded by $url, which carries this same diff authored and signed by the maintainer. Close this one once that merges."

          echo "Opened $url"
